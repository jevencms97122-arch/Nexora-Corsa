[package]
name = "nexora-corsa"
version = "0.1.0"
description = "Nexora-Corsa : launcher plug and play pour Assetto Corsa"
authors = ["Nexora"]
edition = "2024"

[lib]
name = "nexora_corsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
igd-next = "0.18.0"
ureq = "3.5.0"
zip = "9.2.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
sevenz-rust2 = "0.24.2"
unrar = "0.5.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
